<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="animations.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="load-title">ROHAN'S FINAL CUT</div>
  </div>

  <!-- NAVBAR -->
  <nav id="navbar">
    <div class="nav-inner">
      <div class="nav-logo" onclick="RFC_App.goHome()">
        <div class="logo-wordmark">
          <span class="logo-name">Rohan's Final Cut</span>
          <span class="logo-tag">Editorial</span>
        </div>
      </div>

      <div class="nav-links">
        <div class="nav-link active" data-nav="dashboard" onclick="RFC_App.loadRoute('')">Dashboard</div>
        <div class="nav-link" data-nav="movies" onclick="RFC_App.loadRoute('#movies')">Top Movie Charts</div>
        <div class="nav-link" data-nav="tv" onclick="RFC_App.loadRoute('#tv')">Top Series Charts</div>
        <div class="nav-link" data-nav="critics" onclick="RFC_App.loadRoute('#critics')">Critic Reviews</div>
        <div class="nav-link" data-nav="community" onclick="RFC_App.loadRoute('#community')">Community Feed</div>
        <div class="nav-link" data-nav="trailers" onclick="RFC_App.loadRoute('#trailers')">Trailers Hub</div>
        <div class="nav-link" data-nav="news" onclick="RFC_App.loadRoute('#news')">News & Articles</div>
        <div class="nav-link" data-nav="genres" onclick="RFC_App.loadRoute('#genres')">Genre Guide</div>
        <div class="nav-link" data-nav="forums" onclick="RFC_App.loadRoute('#forums')">Forums</div>
        <div class="nav-link" data-nav="notebook" onclick="RFC_App.loadRoute('#notebook')">My Notebook</div>
      </div>

      <div class="nav-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="nav-search-input" placeholder="Search films..."/>
      </div>
      
      <div class="nav-profile" onclick="RFC_App.loadRoute('#profile')" title="User Profile">
        <div class="profile-avatar">R</div>
      </div>
    </div>
  </nav>

  <!-- 3-COLUMN ARCHITECTURE -->
  <div class="layout-wrapper">
    
    <!-- LEFT SIDEBAR (CONSOLE) -->
    <aside id="left-sidebar" class="sidebar glass-panel">
      <div class="sidebar-header">Filtration Console</div>
      <div class="filter-group">
        <label>Genres</label>
        <select id="filter-genre" onchange="RFC_App.applyFilters()">
          <option value="">All Genres</option>
          <option value="28">Action</option>
          <option value="12">Adventure</option>
          <option value="16">Animation</option>
          <option value="35">Comedy</option>
          <option value="80">Crime</option>
          <option value="99">Documentary</option>
          <option value="18">Drama</option>
          <option value="10751">Family</option>
          <option value="14">Fantasy</option>
          <option value="36">History</option>
          <option value="27">Horror</option>
          <option value="10402">Music</option>
          <option value="9648">Mystery</option>
          <option value="10749">Romance</option>
          <option value="878">Science Fiction</option>
          <option value="10770">TV Movie</option>
          <option value="53">Thriller</option>
          <option value="10752">War</option>
          <option value="37">Western</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Minimum Rating</label>
        <select id="filter-rating" onchange="RFC_App.applyFilters()">
          <option value="">Any Rating</option>
          <option value="8">8.0+ Masterpiece</option>
          <option value="7">7.0+ Great</option>
          <option value="6">6.0+ Good</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Release Year</label>
        <select id="filter-year" onchange="RFC_App.applyFilters()">
          <option value="">Any Year</option>
          <option value="2024">2024</option>
          <option value="2023">2023</option>
          <option value="2020">2020s</option>
          <option value="2010">2010s</option>
          <option value="2000">2000s</option>
          <option value="1990">1990s</option>
          <option value="1980">1980s & Older</option>
        </select>
      </div>
      <button class="btn-editorial primary" style="width:100%; margin-top:12px;" onclick="RFC_App.applyFilters()">Apply Filters</button>
    </aside>

    <!-- MAIN APP CONTENT -->
    <main id="app" class="main-content">
      <!-- Pages injected here -->
    </main>

    <!-- RIGHT SIDEBAR (COMMUNITY TICKER) -->
    <aside id="right-sidebar" class="sidebar glass-panel">
      <div class="sidebar-header">Live Community Ticker</div>
      <div id="ticker-feed" class="ticker-feed">
        <!-- Live reviews injected here -->
      </div>
    </aside>

  </div>

  <!-- FULLSCREEN TRAILER MODAL -->
  <div id="trailer-modal">
    <div class="trailer-modal-content glass-panel">
      <div class="trailer-close" onclick="RFC_App.closeTrailer()">×</div>
      <div id="trailer-player"></div>
    </div>
  </div>

  <!-- TOASTS -->
  <div id="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
